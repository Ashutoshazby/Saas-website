<svg width="480" height="100" viewBox="0 0 480 100" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Clan Reborn — Horizontal Logo</title>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Full background -->
  <rect width="480" height="100" rx="14" fill="#0B0F1A"/>

  <!-- Icon box -->
  <rect x="16" y="14" width="72" height="72" rx="12" fill="#131929"/>

  <!-- C letterform -->
  <path d="M63 28 A20 20 0 1 0 63 68 L63 60 A12 12 0 1 1 63 36 Z" fill="white"/>
  <polygon points="63,28 72,28 68,36 63,36" fill="#131929"/>

  <!-- R letterform -->
  <rect x="65" y="28" width="7" height="40" rx="1" fill="white"/>
  <rect x="65" y="28" width="14" height="6" rx="1" fill="white"/>
  <rect x="65" y="44" width="12" height="6" rx="1" fill="white"/>
  <rect x="72" y="28" width="7" height="22" rx="3.5" fill="white"/>
  <polygon points="72,50 79,50 88,68 81,68" fill="white"/>
  <polygon points="79,50 88,50 88,56" fill="#131929"/>
  <circle cx="82" cy="66" r="2.5" fill="url(#grad)"/>

  <!-- Icon accent underline -->
  <rect x="22" y="88" width="60" height="2" rx="1" fill="url(#grad)"/>

  <!-- Vertical separator -->
  <line x1="106" y1="22" x2="106" y2="78" stroke="#1E2A3A" stroke-width="1"/>

  <!-- Left accent tab -->
  <circle cx="108" cy="50" r="2" fill="url(#grad)"/>

  <!-- CLAN text -->
  <text x="120" y="46"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="24" font-weight="700" letter-spacing="6" fill="white">CLAN</text>

  <!-- REBORN text -->
  <text x="120" y="72"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="24" font-weight="300" letter-spacing="6" fill="#94A3B8">REBORN</text>
</svg>
